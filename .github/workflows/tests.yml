name: Tests e Qualidade

on:
  push:
    branches: [main, dev]
    paths:
      - "akemi/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "akemi/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Verificar formatação com Black
        run: black --check akemi tests
      
      - name: Linting com Flake8
        run: flake8 akemi tests --max-line-length=120 --extend-ignore=E203,W503
      
      - name: Type checking com MyPy
        run: mypy akemi --ignore-missing-imports --no-strict-optional
        continue-on-error: true
      
      - name: Executar testes
        run: pytest --verbose
      
      - name: Upload de cobertura
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        continue-on-error: true

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Verificar links no README
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/workflows/markdown-link-check-config.json'
        continue-on-error: true
