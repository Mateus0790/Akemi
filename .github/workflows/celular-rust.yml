name: Celular (Rust)

# Testa e compila o app do celular em Rust (rust-core/akemi-celular).
# Baixe o APK em: Actions → "Celular (Rust)" → a execução mais recente →
# Artifacts → akemi-celular-apk (docs/CELULAR_RUST.md).
on:
  push:
    paths: ["rust-core/akemi-celular/**", "rust-core/Cargo.*", "akemi/net/companion.py",
            ".github/workflows/celular-rust.yml"]
  pull_request:
    paths: ["rust-core/akemi-celular/**", "rust-core/Cargo.*", "akemi/net/companion.py",
            ".github/workflows/celular-rust.yml"]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cargo test
        run: cargo test --manifest-path rust-core/Cargo.toml -p akemi-celular

      - name: cargo clippy
        run: cargo clippy --manifest-path rust-core/Cargo.toml -p akemi-celular --all-targets -- -D warnings

      # O app conversa com o servidor de verdade (akemi/net/companion.py).
      - name: Conversa com o núcleo de verdade
        run: |
          pip install websockets structlog
          cargo build --manifest-path rust-core/Cargo.toml -p akemi-celular --example conversa
          python rust-core/akemi-celular/tests/nucleo_de_teste.py

  android:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust para Android
        run: rustup target add aarch64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-apk
            ~/.cargo/registry
            rust-core/target
          key: celular-android-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: celular-android-

      - name: cargo-apk
        run: command -v cargo-apk || cargo install cargo-apk --locked

      - name: SDK do Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # Chave nova a cada compilação (igual ao APK do Flutter): para atualizar,
      # pode ser preciso desinstalar a versão antiga antes.
      - name: Chave de assinatura
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/akemi.jks" -alias akemi -keyalg RSA -keysize 2048 \
            -validity 3650 -storepass akemi-celular -keypass akemi-celular -dname "CN=Akemi" -noprompt
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/akemi.jks" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=akemi-celular" >> "$GITHUB_ENV"

      - name: Compilar o APK
        working-directory: rust-core
        run: cargo apk build -p akemi-celular --lib --release

      - uses: actions/upload-artifact@v4
        with:
          name: akemi-celular-apk
          path: rust-core/target/release/apk/akemi-celular.apk
          retention-days: 30
