name: App do celular

# Compila o APK do app da Akemi (app/). Baixe em: Actions → "App do celular"
# → a execução mais recente → Artifacts → akemi-app.
on:
  push:
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Gerar a parte Android (não mexe no que já existe)
        run: |
          flutter create --platforms=android --org com.mateus0790 --project-name akemi_app .
          python3 tool/prepare_android.py

      - run: flutter pub get

      - name: Analisar
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: akemi-app
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
