[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akemi"
version = "0.2.0"
description = "Agente de IA autônomo para desktop Windows (estilo Jarvis)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mateus0790" }]
dependencies = [
    "numpy>=1.26,<3",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27",
    "cryptography>=42",  # confere a assinatura da Akemi oficial (akemi-assinatura)
]

[project.optional-dependencies]
audio = [
    "PyAudioWPatch==0.2.12.7",
    "webrtcvad-wheels>=2.0.14",
]
stt = [
    "faster-whisper>=1.1,<2",
    "ctranslate2>=4.5,<5",
]
vision = [
    "mss>=9.0.1",
    "Pillow>=10.4",
    "pytesseract==0.3.13",
]
brain = [
    "httpx>=0.27",
]
llamacpp = [
    "llama-cpp-python==0.3.1",
]
mic = [
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.14",
    "faster-whisper>=1.1,<2",
    "ctranslate2>=4.5,<5",
]
voz = [
    "sherpa-onnx>=1.10,<3",
]
arquivos = [
    "pypdf>=4,<7",
]
tts = [
    "piper-tts>=1.3",
    "sounddevice>=0.4.6",
]
kokoro = [
    "kokoro-onnx>=0.4,<1",
    "sounddevice>=0.4.6",
]
fish = [
    "sounddevice>=0.4.6",  # Fish Audio: a voz vem da nuvem (httpx já é dependência)
]
servidor = [
    "websockets>=15,<18",
]
corpo = [
    "websockets>=15,<18",
]
net = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "httpx==0.27.2",
]
data = [
    "sqlite-utils==3.37",
]
self-improve = [
    "GitPython==3.1.43",
    "PyGithub==2.4.0",
]
windows = [
    "pywin32==306",
]
obs = [
    "websockets>=15,<18",  # clipes pelo obs-websocket
]
discord = [
    "websockets>=15,<18",  # secretária no Discord (Gateway)
]
avatar = [
    "Pillow>=10.4",  # só para skins em PNG; o avatar desenhado usa só o tkinter
]
exe = [
    "pyinstaller>=6.10,<7",  # gera o Akemi.exe (packaging/akemi.spec)
]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "webrtcvad-wheels>=2.0.14",
    "httpx>=0.27",
    "websockets>=15,<18",
]

[project.scripts]
akemi-debug = "akemi.debug:main"
akemi = "akemi.console:main"
akemi-servidor = "akemi.net.server:main"
akemi-corpo = "akemi.net.body:main"
akemi-chip = "akemi.storage.chip:main"
akemi-assinatura = "akemi.assinatura:main"

[tool.setuptools.packages.find]
include = ["akemi*"]

[tool.setuptools.package-data]
akemi = ["brain/*.yaml", "_assinatura.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
