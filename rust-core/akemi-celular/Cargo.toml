[package]
name = "akemi-celular"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "App da Akemi para celular, em Rust: a mesma Akemi do PC, no Android"
publish = false

# No Android o app é a biblioteca (cdylib) carregada pela NativeActivity.
# No PC, `cargo run -p akemi-celular` abre a mesma tela numa janela, para testar.
[lib]
name = "akemi_celular"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "akemi-celular"
path = "src/main.rs"

[dependencies]
serde_json = "1"
serde_yaml = "0.9"
# HTTPS para o modo sozinha (a IA direto do celular). Certificados embutidos.
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = "1.19"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-android-activity-06"] }
jni = "0.21"

[build-dependencies]
slint-build = "1.19"

# Empacotamento com o cargo-apk (ver docs/CELULAR_RUST.md).
[package.metadata.android]
package = "com.mateus0790.akemi_rs"
apk_name = "akemi-celular"
build_targets = ["aarch64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[package.metadata.android.application]
label = "Akemi"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
launch_mode = "singleTask"
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|fontScale"
