# Núcleo em Rust da Akemi (opcional). Cada crate vira um módulo Python via
# PyO3/maturin; a Akemi usa o módulo se estiver instalado e cai no Python se
# não estiver. Veja docs/RUST.md.
[workspace]
resolver = "2"
members = ["akemi-audio", "akemi-painel"]

[profile.release]
lto = "thin"
codegen-units = 1
